services:
  mysql:
    image: mysql:8.0
    container_name: hmap-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hmap_db}
      MYSQL_USER: ${MYSQL_USER:-hmap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hmappass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: hmap-laravel
    working_dir: /app
    volumes:
      - ./laravel:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-hmap_db}
      DB_USERNAME: ${MYSQL_USER:-hmap}
      DB_PASSWORD: ${MYSQL_PASSWORD:-hmappass}
      ML_SERVICE_URL: http://ml:5000
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    image: node:20-alpine
    container_name: hmap-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: hmap-ml
    working_dir: /app
    volumes:
      - ./ml:/app
    ports:
      - "5000:5000"
    environment:
      ML_LOG_LEVEL: info
    command: uvicorn main:app --host 0.0.0.0 --port 5000 --reload

volumes:
  mysql_data:
